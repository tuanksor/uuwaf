---
# Secret for database credentials
apiVersion: v1
kind: Secret
metadata:
  name: uuwaf-db-secret
type: Opaque
data:
  # Note: Replace these with your actual base64-encoded credentials
  MYSQL_USER: cm9vdA==  # root
  MYSQL_PASSWORD: cGFzc3dvcmQ=  # password
---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: uuwaf-operator-config
data:
  MYSQL_HOST: "mysql-service"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "uuwaf"
---
# Service for metrics
apiVersion: v1
kind: Service
metadata:
  name: uuwaf-operator
  labels:
    app: uuwaf-operator
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  selector:
    app: uuwaf-operator
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uuwaf-operator
  labels:
    app: uuwaf-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uuwaf-operator
  template:
    metadata:
      labels:
        app: uuwaf-operator
    spec:
      serviceAccountName: uuwaf-operator
      containers:
      - name: operator
        image: your-registry/uuwaf-operator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: metrics
        envFrom:
        - secretRef:
            name: uuwaf-db-secret
        - configMapRef:
            name: uuwaf-operator-config
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uuwaf-operator
---
# ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uuwaf-operator
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uuwaf-operator
subjects:
- kind: ServiceAccount
  name: uuwaf-operator
  namespace: default
roleRef:
  kind: ClusterRole
  name: uuwaf-operator
  apiGroup: rbac.authorization.k8s.io 